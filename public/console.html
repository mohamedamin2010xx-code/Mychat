<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>WEB CONSOLE</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/admin.css">
  <link rel="stylesheet" href="/monitor.css">
</head>
<body class="console-body">

  <header class="monitor-header">
    <h1>⌨️ WEB CONSOLE</h1>
    <div class="header-actions">
      <a href="/monitor" class="nav-btn">📊 MONITOR</a>
      <a href="/admin-panel" class="nav-btn">⚙️ ADMIN</a>
      <button class="nav-btn" onclick="clearConsole()">🗑️ CLEAR</button>
    </div>
  </header>

  <div class="console-wrap">
    <div class="console-output" id="output"></div>

    <div class="quick-cmds">
      <button class="quick-cmd" onclick="setCmd('ls -la')">ls -la</button>
      <button class="quick-cmd" onclick="setCmd('pwd')">pwd</button>
      <button class="quick-cmd" onclick="setCmd('node -v')">node -v</button>
      <button class="quick-cmd" onclick="setCmd('df -h')">df -h</button>
      <button class="quick-cmd" onclick="setCmd('free -m')">free -m</button>
      <button class="quick-cmd" onclick="setCmd('ps aux')">ps aux</button>
      <button class="quick-cmd" onclick="setCmd('ls public/')">ls public/</button>
      <button class="quick-cmd" onclick="setCmd('ls modules/')">ls modules/</button>
      <button class="quick-cmd" onclick="setCmd('cat package.json')">package.json</button>
      <button class="quick-cmd" onclick="setCmd('whoami')">whoami</button>
    </div>

    <div class="console-input-wrap">
      <span class="console-prompt" id="prompt">~/mychat $</span>
      <input
        type="text"
        class="console-input"
        id="cmdInput"
        placeholder="اكتب أمراً..."
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      >
    </div>
  </div>

  <script src="/console.js"></script>
</body>
</html>
