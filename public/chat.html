<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>WORMGPT :: TERMINAL</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="chat-body">
  <canvas id="matrix-bg"></canvas>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span id="me">...</span>
        <button class="icon-btn" onclick="logout()" title="DISCONNECT">⏻</button>
      </div>

      <div class="section">
        <div class="section-title">PUBLIC ROOMS</div>
        <div id="publicList"></div>
      </div>

      <div class="section">
        <div class="section-title">PRIVATE CHANNELS</div>
        <div id="privateList"></div>
        <button class="new-chat" onclick="showUsersList()">[ + NEW CHANNEL ]</button>
        <div id="usersList" class="users-list hidden"></div>
      </div>
    </aside>

    <main class="main">
      <header class="chat-header">
        <button class="menu-btn" onclick="toggleSidebar()" title="MENU">☰</button>
        <span id="chatTitle">SELECT CHANNEL</span>
      </header>

      <div id="messages" class="messages">
        <div class="empty-state" id="emptyState">
          <div class="logo">💀</div>
          <div class="title">SYSTEM READY</div>
          <div class="subtitle">
            &gt; اختر غرفة عامة أو ابدأ محادثة خاصة من القائمة الجانبية<br>
            &gt; جميع الرسائل محفوظة في قاعدتك المحلية فقط
          </div>
        </div>
      </div>

      <div class="composer">
        <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="ATTACH IMAGE">📎</button>
        <input type="file" id="fileInput" accept="image/*" hidden>
        <textarea id="input" placeholder="اكتب رسالتك..." rows="1"></textarea>
        <button class="send-btn" onclick="sendMessage()" title="TRANSMIT">➤</button>
      </div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/matrix.js"></script>
  <script src="/chat.js"></script>
</body>
</html>
