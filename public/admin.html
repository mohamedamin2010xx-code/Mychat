<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>ADMIN ACCESS</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body class="auth-body">
  <canvas id="matrix-bg"></canvas>

  <div class="auth-card">
    <h1 style="font-size:24px;letter-spacing:4px">ADMIN</h1>
    <p class="subtitle">RESTRICTED AREA</p>

    <input id="code" type="password" placeholder="ACCESS CODE" autocomplete="off" spellcheck="false">

    <button onclick="doAdminLogin()">[ AUTHORIZE ]</button>

    <p id="msg" class="msg"></p>
  </div>

  <script src="/matrix.js"></script>
  <script>
    async function doAdminLogin() {
      const code = document.getElementById('code').value.trim();
      const msgEl = document.getElementById('msg');
      if (!code) { msgEl.textContent = '!! ENTER CODE !!'; return; }
      msgEl.textContent = '> VERIFYING...';
      const r = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code })
      }).then(r => r.json());
      if (r.ok) {
        msgEl.textContent = '> ACCESS GRANTED';
        setTimeout(() => location.href = '/admin-panel', 300);
      } else {
        msgEl.textContent = '!! ' + r.error + ' !!';
      }
    }
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') doAdminLogin();
    });
  </script>
</body>
</html>
