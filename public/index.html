<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>WORMGPT :: ACCESS</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-body">
  <canvas id="matrix-bg"></canvas>

  <div class="auth-card">
    <h1>DARK ANONIMOS CHAT</h1>
    <p class="subtitle">SYSTEM ACCESS TERMINAL</p>

    <input id="username" type="text" placeholder="USERNAME" autocomplete="off" spellcheck="false">
    <input id="password" type="password" placeholder="PASSWORD">

    <button onclick="doLogin()">[ AUTHENTICATE ]</button>
    <button class="secondary" onclick="doRegister()">[ NEW IDENTITY ]</button>

    <p id="msg" class="msg"></p>
  </div>

  <script src="/matrix.js"></script>
  <script>
    async function post(url, body) {
      const r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      return r.json();
    }

    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const msgEl = document.getElementById('msg');
      if (!username || !password) {
        msgEl.textContent = '!! FILL ALL FIELDS !!';
        return;
      }
      msgEl.textContent = '> AUTHENTICATING...';
      const r = await post('/api/login', { username, password });
      if (r.ok) {
        msgEl.textContent = '> ACCESS GRANTED';
        setTimeout(() => location.href = '/chat', 300);
      } else {
        msgEl.textContent = '!! ' + r.error + ' !!';
      }
    }

    async function doRegister() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const msgEl = document.getElementById('msg');
      if (!username || !password) {
        msgEl.textContent = '!! FILL ALL FIELDS !!';
        return;
      }
      msgEl.textContent = '> CREATING IDENTITY...';
      const r = await post('/api/register', { username, password });
      if (r.ok) {
        msgEl.textContent = '> IDENTITY CREATED';
        setTimeout(() => location.href = '/chat', 300);
      } else {
        msgEl.textContent = '!! ' + r.error + ' !!';
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
